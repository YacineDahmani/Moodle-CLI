[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "moodle-cli"
version = "1.0.0"
description = "A modern CLI and interactive terminal tool for Moodle course synchronization and resource management."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28.0",
    "rich>=13.0.0",
    "click>=8.0.0",
    "questionary>=2.0.0"
]

[project.scripts]
moodle = "moodle_cli.cli:cli"
